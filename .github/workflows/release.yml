name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="ssh-mcp-${VERSION}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$NAME" .
          if [ "$GOOS" = "windows" ]; then
            zip "${NAME}.zip" "${NAME}.exe"
          else
            tar czf "${NAME}.tar.gz" "$NAME"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ssh-mcp-*-${{ matrix.goos }}-${{ matrix.goarch }}.*
          generate_release_notes: true
